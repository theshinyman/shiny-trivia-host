<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Brian's Trivia Host</title>

<style>
body{
    font-family:Arial,sans-serif;
    text-align:center;
    padding:20px;
}

h1{
    margin-bottom:20px;
}

#timer{
    font-size:80px;
    margin:30px;
}

button{
    font-size:20px;
    padding:15px 25px;
    margin:10px;
}
</style>
</head>

<body>

<h1>Shiny Trivia Host</h1>

<div id="timer">60</div>

<button onclick="startTimer()">Start</button>
<button onclick="pauseTimer()">Pause</button>
<button onclick="resetTimer()">Reset</button>

<script>

let time = 60;
let interval = null;
let paused = true;

function updateDisplay(){
    document.getElementById("timer").innerText = time;
}

function startTimer(){

    if(!paused){
        return;
    }

    paused = false;

    interval = setInterval(function(){

        time--;

        updateDisplay();

        if(time <= 0){
            clearInterval(interval);
            paused = true;
            alert("Time's Up!");
        }

    },1000);
}

function pauseTimer(){
    clearInterval(interval);
    paused = true;
}

function resetTimer(){
    clearInterval(interval);
    paused = true;
    time = 60;
    updateDisplay();
}

updateDisplay();

</script>

</body>
</html>

</body>
</html>

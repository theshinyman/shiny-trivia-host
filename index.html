<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Brian's Trivia Host</title>

<style>
body{
    font-family:Arial,sans-serif;
    text-align:center;
    padding:20px;
}

button{
    font-size:20px;
    padding:15px;
    margin:10px;
}

#timer{
    font-size:60px;
    margin:20px;
}
</style>
</head>

<body>

<h1>Brian's Trivia Host</h1>

<div id="timer">60</div>

<button onclick="startTimer()">Start Timer</button>
<button onclick="resetTimer()">Reset</button>

<script>

let time=60;
let interval;

function startTimer(){
    clearInterval(interval);

    interval=setInterval(()=>{
        time--;
        document.getElementById("timer").innerText=time;

        if(time<=0){
            clearInterval(interval);
            alert("Time's Up!");
        }

    },1000);
}

function resetTimer(){
    clearInterval(interval);
    time=60;
    document.getElementById("timer").innerText=time;
}

</script>

</body>
</html>

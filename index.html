<!DOCTYPE html>
<html>
<head>
<title>Shiny Trivia</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{text-align:center;font-family:Arial;padding:20px}
#timer{font-size:100px;font-weight:bold;margin:30px}
button{font-size:22px;padding:15px;margin:5px}
</style>
</head>
<body>

<h1>Brian's Trivia Host</h1>

<button onclick="startTimer(15)">15s</button>
<button onclick="startTimer(30)">30s</button>
<button onclick="startTimer(60)">60s</button>

<br><br>

<div id="timer">0:00</div>

<button id="pauseBtn" onclick="pauseTimer()">Pause</button>
<button onclick="resetTimer()">Reset</button>

<script>
let t=0;
let d=0;
let run=null;
let paused=false;

function show(){
let m=Math.floor(t/60);
let s=t%60;
document.getElementById("timer").innerHTML=
m+":"+String(s).padStart(2,"0");
}

function startTimer(sec){
clearInterval(run);
t=sec;
d=sec;
paused=false;
document.getElementById("pauseBtn").innerHTML="Pause";
show();

run=setInterval(function(){
if(paused)return;
t--;
show();

if(t<=0){
clearInterval(run);
document.getElementById("timer").innerHTML="TIME'S UP!";
}
},1000);
}

function pauseTimer(){
paused=!paused;
document.getElementById("pauseBtn").innerHTML=
paused?"Resume":"Pause";
}

function resetTimer(){
clearInterval(run);
t=d;
paused=false;
document.getElementById("pauseBtn").innerHTML="Pause";
show();
}

show();
</script>

</body>
</html>

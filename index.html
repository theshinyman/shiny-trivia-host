<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beauty in the Beach Trivia Night V18</title>
<style>
body{font-family:Arial,sans-serif;text-align:center;margin:0;padding:15px;background:#4FA9C8;color:white;}
h1{margin:5px 0;font-size:34px;}
h2{margin:0 0 15px 0;font-size:24px;}
button{background:white;color:black;border:3px solid black;border-radius:12px;font-size:24px;font-weight:bold;padding:14px 18px;margin:4px;min-width:95px;}
#timer{font-size:110px;font-weight:bold;margin:30px 0;color:white;}
.warning{color:#FFFF00!important;}
.expired{color:#FF0000!important;}
</style>
</head>
<body>
<h1>Beauty in the Beach</h1>
<h2>Trivia Night</h2>

<div>
<button onclick="startPreset(15)">15s</button>
<button onclick="startPreset(30)">30s</button>
<button onclick="startPreset(45)">45s</button>
</div>
<div>
<button onclick="startPreset(60)">60s</button>
<button onclick="startPreset(90)">90s</button>
<button onclick="startPreset(120)">2m</button>
</div>

<div id="timer">1:00</div>

<div>
<button id="pauseBtn" onclick="togglePause()">Pause</button>
<button onclick="resetTimer()">Reset</button>
</div>

<script>
let time=60,defaultTime=60,timerInterval=null,paused=false,audioCtx=null;
function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function tone(f,d,v,t="square"){try{const c=getAudio(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;o.type=t;g.gain.value=v;o.start();setTimeout(()=>o.stop(),d);}catch(e){}}
function warningBeep(){tone(1000,120,0.18);}
function raspyBuzzer(){tone(95,1200,0.55,"sawtooth");}
function formatTime(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function updateDisplay(){const t=document.getElementById("timer");t.textContent=formatTime(Math.max(time,0));if(time<=10&&time>=1)t.classList.add("warning");else if(time>10)t.classList.remove("warning");}
function startPreset(s){clearInterval(timerInterval);time=defaultTime=s;paused=false;const t=document.getElementById("timer");t.classList.remove("warning","expired");document.getElementById("pauseBtn").textContent="Pause";updateDisplay();timerInterval=setInterval(runTimer,1000);}
function runTimer(){if(paused)return;time--;if(time<=10&&time>=1)warningBeep();if(time<=0){clearInterval(timerInterval);const t=document.getElementById("timer");t.classList.remove("warning");t.classList.add("expired");t.textContent="0:00";raspyBuzzer();return;}updateDisplay();}
function togglePause(){paused=!paused;document.getElementById("pauseBtn").textContent=paused?"Resume":"Pause";}
function resetTimer(){clearInterval(timerInterval);paused=false;time=defaultTime;document.getElementById("timer").classList.remove("warning","expired");updateDisplay();}
updateDisplay();
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Brian's Trivia Host</title>

<style>
body{
font-family:Arial,sans-serif;
text-align:center;
padding:20px;
}

h1{
font-size:48px;
}

#timer{
font-size:120px;
font-weight:bold;
margin:40px 0;
}

button{
font-size:24px;
padding:20px;
margin:8px;
min-width:120px;
}

#message{
font-size:36px;
font-weight:bold;
color:red;
height:50px;
margin:20px;
}
</style>
</head>

<body>

<h1>Brian's Trivia Host</h1>

<div>
<button onclick="startPreset(15)">15s</button>
<button onclick="startPreset(30)">30s</button>
</div>

<div>
<button onclick="startPreset(45)">45s</button>
<button onclick="startPreset(60)">60s</button>
</div>

<div>
<button onclick="startPreset(90)">90s</button>
<button onclick="startPreset(120)">2m</button>
</div>

<div>
<button onclick="startPreset(180)">3m</button>
<button onclick="startPreset(300)">5m</button>
</div>

<div id="timer">1:00</div>

<div id="message"></div>

<div>
<button id="pauseBtn" onclick="togglePause()">Pause</button>
<button onclick="resetTimer()">Reset</button>
</div>

<script>

let time=60;
let defaultTime=60;
let interval=null;
let paused=false;

function formatTime(seconds){
let m=Math.floor(seconds/60);
let s=seconds%60;
return m+":" + String(s).padStart(2,"0");
}

function updateDisplay(){
document.getElementById("timer").innerText=formatTime(time);
}

function startPreset(seconds){
clearInterval(interval);
defaultTime=seconds;
time=seconds;
paused=false;
document.getElementById("pauseBtn").innerText="Pause";
document.getElementById("message").innerText="";
updateDisplay();

interval=setInterval(function(){

if(paused)return;

time--;

if(time===15){
document.getElementById("message").innerText="15 SECOND WARNING";
}

if(time<=10 && time>0){
document.getElementById("message").innerText=time;
}

if(time<=0){
clearInterval(interval);
document.getElementById("message").innerText="TIME'S UP";
time=0;
}

updateDisplay();

},1000);
}

function togglePause(){
paused=!paused;
document.getElementById("pauseBtn").innerText=
paused ? "Resume" : "Pause";
}

function resetTimer(){
clearInterval(interval);
time=defaultTime;
paused=false;
document.getElementById("pauseBtn").innerText="Pause";
document.getElementById("message").innerText="";
updateDisplay();
}

updateDisplay();

</script>

</body>
</html>

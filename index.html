<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brian's Trivia Host</title>

<style>
body{
    font-family:Arial,sans-serif;
    text-align:center;
    padding:20px;
}

h1{
    margin-bottom:30px;
}

#timer{
    font-size:120px;
    margin:30px;
    font-weight:bold;
}

.warning{
    color:orange;
}

.danger{
    color:red;
}

.flash{
    animation:flash 1s infinite;
}

@keyframes flash{
    50%{
        opacity:0.3;
    }
}

button{
    font-size:22px;
    padding:15px 25px;
    margin:8px;
}

.preset-row{
    margin-bottom:20px;
}
</style>
</head>

<body>

<h1>Brian's Trivia Host</h1>

<div class="preset-row">
    <button onclick="setTimer(15)">15s</button>
    <button onclick="setTimer(30)">30s</button>
    <button onclick="setTimer(45)">45s</button>
    <button onclick="setTimer(60)">60s</button>
    <button onclick="setTimer(90)">90s</button>
    <button onclick="setTimer(120)">2 min</button>
</div>

<div id="timer">60</div>

<div>
    <button onclick="startTimer()">Start</button>
    <button onclick="pauseTimer()">Pause</button>
</div>

<div>
    <button onclick="resetTimer()">Reset</button>
</div>

<script>

let timer = 60;
let startingTime = 60;
let interval = null;

function updateDisplay(){

    const display = document.getElementById("timer");

    if(timer <= 0){
        display.innerHTML = "TIME'S UP!";
        display.className = "danger";
        return;
    }

    display.innerHTML = timer;

    if(timer <= 10){
        display.className = "danger flash";
    }
    else if(timer <= 15){
        display.className = "warning";
    }
    else{
        display.className = "";
    }
}

function setTimer(seconds){
    pauseTimer();
    timer = seconds;
    startingTime = seconds;
    updateDisplay();
}

function startTimer(){

    if(interval) return;

    interval = setInterval(function(){

        timer--;

        updateDisplay();

        if(timer <= 0){
            clearInterval(interval);
            interval = null;
        }

    },1000);
}

function pauseTimer(){
    clearInterval(interval);
    interval = null;
}

function resetTimer(){
    pauseTimer();
    timer = startingTime;
    updateDisplay();
}

updateDisplay();

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Brian's Trivia Host</title>

<style>

body{
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
}

h1{
    margin-bottom: 20px;
}

#timer{
    font-size: 90px;
    margin: 30px;
    font-weight: bold;
}

button{
    font-size: 20px;
    padding: 15px 20px;
    margin: 8px;
    min-width: 110px;
}

.controls{
    margin-top: 20px;
}

.presets{
    margin-bottom: 25px;
}

</style>
</head>

<body>

<h1>Brian's Trivia Host</h1>

<div class="presets">
    <button onclick="setTime(15)">15 Sec</button>
    <button onclick="setTime(30)">30 Sec</button>
    <button onclick="setTime(60)">60 Sec</button>
    <button onclick="setTime(90)">90 Sec</button>
    <button onclick="setTime(120)">2 Min</button>
</div>

<div id="timer">1:00</div>

<div class="controls">
    <button onclick="startTimer()">Start</button>
    <button onclick="pauseTimer()">Pause</button>
    <button onclick="resetTimer()">Reset</button>
</div>

<script>

let time = 60;
let defaultTime = 60;
let interval = null;
let paused = true;

function updateDisplay(){

    let minutes = Math.floor(time / 60);
    let seconds = time % 60;

    if(seconds < 10){
        seconds = "0" + seconds;
    }

    document.getElementById("timer").innerText =
        minutes + ":" + seconds;
}

function setTime(seconds){

    clearInterval(interval);

    paused = true;
    time = seconds;
    defaultTime = seconds;

    updateDisplay();
}

function startTimer(){

    if(!paused){
        return;
    }

    paused = false;

    interval = setInterval(function(){

        time--;

        updateDisplay();

        if(time <= 0){

            clearInterval(interval);

            paused = true;

            alert("Time's Up!");
        }

    },1000);
}

function pauseTimer(){

    clearInterval(interval);

    paused = true;
}

function resetTimer(){

    clearInterval(interval);

    paused = true;

    time = defaultTime;

    updateDisplay();
}

updateDisplay();

</script>

</body>
</html>
